# rustc-wrapper scopes sancov instrumentation to sui_adapter_latest only.
# Without scoping, the full dependency closure (~183K edges) is instrumented and
# MaxMapFeedback saturates immediately; with it, only the typing pipeline is
# instrumented (~few hundred edges).
#
# Only effective when cargo is invoked from within `fuzz/` (CWD-based config
# discovery). Building from the repo root silently skips this config entirely.
#
# An explicit target is REQUIRED so Cargo applies rustflags only to target
# artifacts, not to host build-scripts/proc-macros.
# Change this triple to match your host:
#   Linux x86-64 : x86_64-unknown-linux-gnu   (default)
#   macOS ARM    : aarch64-apple-darwin
#   macOS Intel  : x86_64-apple-darwin
[build]
target = "x86_64-unknown-linux-gnu"
rustc-wrapper = "./rustc_sancov_wrapper.sh"
